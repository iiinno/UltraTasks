[package]
name = "ultratasks-sync"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["server", "cli"]
server = ["dep:axum", "dep:rusqlite", "dep:sha2", "dep:subtle", "dep:getrandom", "dep:hex", "tokio/net", "tokio/sync", "tokio/time"]
cli = ["dep:clap", "dep:anyhow", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal", "tokio/time"]

[[bin]]
name = "ultratasks-sync"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "http_sync"
required-features = ["server"]

[dependencies]
ultratasks-core = { path = "../ultratasks-core" }
axum = { version = "0.8", features = ["json"], optional = true }
tokio = { version = "1", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }
hex = { version = "0.4", optional = true }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
chrono = "0.4"

[lints]
workspace = true
