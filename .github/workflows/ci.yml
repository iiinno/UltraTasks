name: Rust quality

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: core
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core tests and acceptance scenarios
        run: cargo test --locked -p ultratasks-core --all-targets
      - name: Static analysis
        run: cargo clippy --locked -p ultratasks-core --all-targets -- -D warnings

  windows-desktop:
    name: Windows native desktop
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: desktop
      - name: Verify native dependency graph
        run: python scripts/check_native_dependencies.py
      - name: Desktop static analysis
        run: cargo clippy --locked -p ultratasks-desktop --all-targets -- -D warnings
      - name: Desktop date and presentation tests
        run: cargo test --locked -p ultratasks-desktop
      - name: Build Windows application
        run: cargo build --locked --release -p ultratasks-desktop
      - name: Retain development binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ultratasks-windows-x64
          path: target/release/ultratasks-desktop.exe
          if-no-files-found: error
          retention-days: 7
