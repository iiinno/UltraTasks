[package]
name = "ultratasks-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
