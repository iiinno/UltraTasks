[workspace]
members = ["crates/ultratasks-core", "apps/desktop"]
default-members = ["crates/ultratasks-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "cache", "fallible_uint", "hooks"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
uuid = { version = "=1.29.2", features = ["v4"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
tempfile = "=3.27.0"
