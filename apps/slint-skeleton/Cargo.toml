[package]
name = "ultratasks-skeleton"
version = "0.0.0"
edition = "2024"
publish = false

# 既存ワークスペースのCargo.lockと検証を変えないため、独立したワークスペースにする。
[workspace]

[dependencies]
# 実測でOpenGL描画は約103MB、ソフトウェア描画は6.5MBだったため、ソフトウェア描画だけを組み込む。
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
ultratasks-core = { path = "../../crates/ultratasks-core" }

[build-dependencies]
slint-build = "=1.18.1"
