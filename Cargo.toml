[workspace]
members = [
    "crates/ultratasks-core",
    "crates/ultratasks-notifications",
    "crates/ultratasks-sync",
    "crates/ultratasks-ai",
    "apps/desktop",
    "apps/automation",
    "apps/android/native",
    "apps/server",
]
default-members = ["crates/ultratasks-core", "crates/ultratasks-notifications", "crates/ultratasks-sync", "apps/automation", "apps/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
