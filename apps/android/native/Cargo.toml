[package]
name = "ultratasks-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "ultratasks_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4"
jni = "0.22.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
ultratasks-ai = { path = "../../../crates/ultratasks-ai" }
ultratasks-sync = { path = "../../../crates/ultratasks-sync", default-features = false }
ultratasks-core = { path = "../../../crates/ultratasks-core" }
ultratasks-notifications = { path = "../../../crates/ultratasks-notifications" }

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "=0.7.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
